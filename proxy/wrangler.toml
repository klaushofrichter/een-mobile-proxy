name = "een-mobile-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

[observability.logs]
enabled = true

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "EEN_OAUTH_SESSIONS"
id = "c72e25b0bea145a4b2e2bfaf20ec5883"

# Secrets (set via wrangler secret put):
# - CLIENT_ID
# - CLIENT_SECRET
# - ADMIN_EMAILS
# - ALLOWED_SCHEMES        (comma-separated custom URL schemes, e.g., "myapp,myotherapp")
# - ALLOWED_API_DOMAINS
# - MAX_KV_KEYS
