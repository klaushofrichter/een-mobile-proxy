name = "een-oauth-proxy"
main = "src/index.js"
compatibility_date = "2024-12-01"

[observability.logs]
enabled = true

[vars]
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "EEN_OAUTH_SESSIONS"
id = "b6ac1ea749dc43669fe0696903cb39f7"

# Secrets (set via wrangler secret put):
# - CLIENT_ID
# - CLIENT_SECRET
# - ADMIN_EMAILS
# - ALLOWED_ORIGINS
# - ALLOWED_API_DOMAINS
