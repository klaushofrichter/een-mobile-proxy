name: Validate Branch Protection

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-branch-rules:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Validate PR source branch
        uses: actions/github-script@v7
        with:
          script: |
            // Configuration
            const FEATURE_BRANCH_PATTERNS = ['feature/', 'feat/', 'fix/', 'hotfix/', 'bugfix/'];
            
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;
            
            // Helper function to escape markdown in branch names (comprehensive)
            // Escapes: backticks, asterisks, underscores, brackets, parentheses, hash, greater than, tilde, pipe, backslash
            const escapeMarkdown = (text) => {
              // Properly escape closing bracket in regex character class
              // Escape backslash first to avoid double-escaping
              return text.replace(/\\/g, '\\\\').replace(/[`*_\[\]()#>\~|]/g, '\\$&');
            };
            
            // Fetch all comments once at the start to avoid duplicate API calls
            let allComments;
            try {
              allComments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              console.log(`Fetched ${allComments.data.length} existing comments`);
            } catch (error) {
              console.error(`Failed to fetch comments: ${error.message}`);
              // Continue without duplicate detection if API call fails
              allComments = { data: [] };
            }
            
            // Helper function to check if comment already exists (using pre-fetched comments)
            const hasExistingComment = (searchText) => {
              return allComments.data.some(comment => {
                // Improved bot detection: check type, endsWith for [bot] suffix, or exact match
                const isBot = comment.user.type === 'Bot' || 
                             comment.user.login.endsWith('[bot]') ||
                             comment.user.login === 'github-actions[bot]';
                return isBot && comment.body.includes(searchText);
              });
            };
            
            console.log(`PR #${prNumber}: ${headBranch} -> ${baseBranch}`);
            
            // Rule 1: Production can only receive PRs from develop
            if (baseBranch === 'production') {
              if (headBranch !== 'develop') {
                const searchText = 'Branch Protection Violation';
                if (!hasExistingComment(searchText)) {
                  const escapedHeadBranch = escapeMarkdown(headBranch);
                  const errorMsg = `❌ **Branch Protection Violation**\n\n` +
                    `PRs to \`production\` can only come from \`develop\` branch.\n\n` +
                    `This PR is trying to merge \`${escapedHeadBranch}\` → \`production\`.\n\n` +
                    `**Required workflow:**\n` +
                    `1. Merge this PR into \`develop\` first\n` +
                    `2. Then create a new PR from \`develop\` → \`production\`\n\n` +
                    `Please close this PR and follow the correct workflow.`;
                  
                  try {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: prNumber,
                      body: errorMsg
                    });
                    console.log('Posted branch protection violation comment');
                  } catch (error) {
                    console.error(`Failed to post comment: ${error.message}`);
                    // Continue to fail the check even if comment posting fails
                  }
                }
                
                // Fail the check
                core.setFailed(`Production branch can only receive PRs from develop. This PR is from ${headBranch}.`);
                return;
              }
              console.log('✅ Valid: PR to production from develop');
            }
            
            // Rule 2: Develop should not receive PRs from production
            if (baseBranch === 'develop' && headBranch === 'production') {
              const searchText = 'Branch Protection Violation';
              if (!hasExistingComment(searchText)) {
                const errorMsg = `❌ **Branch Protection Violation**\n\n` +
                  `PRs from \`production\` to \`develop\` are not allowed.\n\n` +
                  `The flow should be: \`feature\` → \`develop\` → \`production\`\n\n` +
                  `If you need to sync changes, use the sync workflow or merge directly if needed.`;
                
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: errorMsg
                  });
                  console.log('Posted reverse flow violation comment');
                } catch (error) {
                  console.error(`Failed to post comment: ${error.message}`);
                  // Continue to fail the check even if comment posting fails
                }
              }
              
              core.setFailed('PRs from production to develop are not allowed.');
              return;
            }
            
            // Rule 3: Feature branches should go to develop (warning, not blocking)
            const isFeatureBranch = FEATURE_BRANCH_PATTERNS.some(pattern => headBranch.startsWith(pattern));
            
            if (baseBranch === 'production' && isFeatureBranch) {
              const searchText = 'Branch Workflow Warning';
              if (!hasExistingComment(searchText)) {
                const escapedHeadBranch = escapeMarkdown(headBranch);
                const warningMsg = `⚠️ **Branch Workflow Warning**\n\n` +
                  `Feature branches should typically be merged into \`develop\` first, not directly into \`production\`.\n\n` +
                  `This PR is trying to merge \`${escapedHeadBranch}\` → \`production\`.\n\n` +
                  `**Recommended workflow:**\n` +
                  `1. Merge this PR into \`develop\` first\n` +
                  `2. Test and validate in \`develop\`\n` +
                  `3. Then create a PR from \`develop\` → \`production\`\n\n` +
                  `If this is intentional, you can proceed, but please ensure proper testing.`;
                
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: warningMsg
                  });
                  console.log('Posted feature branch warning comment');
                } catch (error) {
                  console.error(`Failed to post comment: ${error.message}`);
                  // Warning is non-blocking, so continue even if comment fails
                }
              }
              
              console.log('⚠️ Warning: Feature branch going directly to production');
            }
            
            console.log('✅ Branch protection rules validated');

