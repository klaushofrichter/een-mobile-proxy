name: Sync Develop with Production

on:
  pull_request:
    branches:
      - production
    types:
      - closed

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync develop with production
        run: |
          # Verify develop branch exists on remote
          if ! git ls-remote --heads origin develop | grep -q develop; then
            echo "::error::develop branch does not exist on remote"
            exit 1
          fi

          # Fetch develop branch locally
          if ! git fetch origin develop:develop 2>/dev/null; then
            git checkout -b develop origin/develop
          fi
          git checkout develop

          # Merge with conflict detection
          if ! git merge origin/production -m "Auto-sync: Merge production into develop after PR #${{ github.event.pull_request.number }}"; then
            echo "::error::Merge conflict detected. Manual intervention required."
            git merge --abort
            exit 1
          fi

          git push origin develop
