name: Create Release

on:
  workflow_run:
    workflows: ["Test Deployed Admin App"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Get version numbers
        id: versions
        run: |
          ADMIN_VERSION=$(node -p "require('./admin/package.json').version")
          PROXY_VERSION=$(node -p "require('./proxy/package.json').version")
          # Create combined release tag using both proxy and admin versions
          RELEASE_TAG="proxy-v${PROXY_VERSION}_admin-v${ADMIN_VERSION}"
          echo "admin_version=$ADMIN_VERSION" >> $GITHUB_OUTPUT
          echo "proxy_version=$PROXY_VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Admin version: $ADMIN_VERSION"
          echo "Proxy version: $PROXY_VERSION"
          echo "Release tag: $RELEASE_TAG"

      - name: Check if release already exists
        id: check_release
        run: |
          if gh release view "${{ steps.versions.outputs.release_tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.versions.outputs.release_tag }} already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.versions.outputs.release_tag }} does not exist, will create"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release archive
        if: steps.check_release.outputs.exists == 'false'
        run: |
          ARCHIVE_NAME="een-oauth-proxy-v${{ steps.versions.outputs.proxy_version }}_v${{ steps.versions.outputs.admin_version }}"
          git archive --format=zip --prefix="${ARCHIVE_NAME}/" -o "${ARCHIVE_NAME}.zip" HEAD
          git archive --format=tar.gz --prefix="${ARCHIVE_NAME}/" -o "${ARCHIVE_NAME}.tar.gz" HEAD
          echo "Created ${ARCHIVE_NAME}.zip and ${ARCHIVE_NAME}.tar.gz"
          ls -la *.zip *.tar.gz
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          ARCHIVE_NAME="een-oauth-proxy-v${{ steps.versions.outputs.proxy_version }}_v${{ steps.versions.outputs.admin_version }}"
          gh release create "${{ steps.versions.outputs.release_tag }}" \
            --title "Proxy v${{ steps.versions.outputs.proxy_version }} / Admin v${{ steps.versions.outputs.admin_version }}" \
            --notes "## EEN OAuth Proxy Release

          **Admin App Version:** ${{ steps.versions.outputs.admin_version }}
          **Proxy Version:** ${{ steps.versions.outputs.proxy_version }}

          ### Downloads
          - \`${ARCHIVE_NAME}.zip\` - ZIP archive
          - \`${ARCHIVE_NAME}.tar.gz\` - TAR.GZ archive

          ### Deployed URLs
          - **Admin App:** ${{ vars.VITE_REDIRECT_URI }}
          - **Proxy:** ${{ vars.VITE_PROXY_URL }}
          " \
            "${ARCHIVE_NAME}.zip" \
            "${ARCHIVE_NAME}.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: steps.check_release.outputs.exists == 'false'
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.versions.outputs.release_tag }}"
          RELEASE_TIME=$(TZ='America/Chicago' date +"%Y-%m-%d %H:%M:%S CT")

          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 New Release: Proxy v${{ steps.versions.outputs.proxy_version }} / Admin v${{ steps.versions.outputs.admin_version }}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Admin Version:*\n${{ steps.versions.outputs.admin_version }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Proxy Version:*\n${{ steps.versions.outputs.proxy_version }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Released:*\n${RELEASE_TIME}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n${{ github.repository }}"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployed URLs:*\n• <${{ vars.VITE_REDIRECT_URI }}|Admin App>\n• <${{ vars.VITE_PROXY_URL }}|OAuth Proxy>"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "📦 View Release",
                      "emoji": true
                    },
                    "url": "${RELEASE_URL}",
                    "style": "primary"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "📋 Release Notes",
                      "emoji": true
                    },
                    "url": "${RELEASE_URL}"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Triggered by GitHub Actions • Workflow: Create Release"
                  }
                ]
              }
            ]
          }
          EOF
          echo "✅ Slack notification sent"

      - name: Summary
        run: |
          if [ "${{ steps.check_release.outputs.exists }}" == "true" ]; then
            echo "### ⏭️ Release Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Release ${{ steps.versions.outputs.release_tag }} already exists." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Release Created" >> $GITHUB_STEP_SUMMARY
            echo "**Tag:** ${{ steps.versions.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "**Admin Version:** ${{ steps.versions.outputs.admin_version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Proxy Version:** ${{ steps.versions.outputs.proxy_version }}" >> $GITHUB_STEP_SUMMARY
          fi
