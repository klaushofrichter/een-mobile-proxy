name: Create Release

on:
  workflow_run:
    workflows: ["Test Deployed Admin App"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production

      - name: Get version numbers
        id: versions
        run: |
          set -e
          echo "📦 Reading version numbers from package.json files..."
          
          if [ ! -f "./admin/package.json" ]; then
            echo "❌ Error: admin/package.json not found"
            exit 1
          fi
          if [ ! -f "./proxy/package.json" ]; then
            echo "❌ Error: proxy/package.json not found"
            exit 1
          fi
          
          ADMIN_VERSION=$(node -p "require('./admin/package.json').version")
          PROXY_VERSION=$(node -p "require('./proxy/package.json').version")
          
          if [ -z "$ADMIN_VERSION" ] || [ -z "$PROXY_VERSION" ]; then
            echo "❌ Error: Failed to read version numbers"
            exit 1
          fi
          
          # Create combined release tag using both proxy and admin versions
          RELEASE_TAG="proxy-v${PROXY_VERSION}_admin-v${ADMIN_VERSION}"
          echo "admin_version=$ADMIN_VERSION" >> $GITHUB_OUTPUT
          echo "proxy_version=$PROXY_VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          echo "✅ Admin version: $ADMIN_VERSION"
          echo "✅ Proxy version: $PROXY_VERSION"
          echo "✅ Release tag: $RELEASE_TAG"

      - name: Check if release already exists
        id: check_release
        run: |
          set -e
          RELEASE_TAG="${{ steps.versions.outputs.release_tag }}"
          echo "🔍 Checking if release '$RELEASE_TAG' already exists..."
          
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Release $RELEASE_TAG already exists, skipping creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Release $RELEASE_TAG does not exist, will create new release"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release archive
        id: create_archive
        if: steps.check_release.outputs.exists == 'false'
        run: |
          set -e
          ARCHIVE_NAME="een-oauth-proxy-v${{ steps.versions.outputs.proxy_version }}_v${{ steps.versions.outputs.admin_version }}"
          echo "📦 Creating release archives with name: $ARCHIVE_NAME"
          
          echo "Creating ZIP archive..."
          if ! git archive --format=zip --prefix="${ARCHIVE_NAME}/" -o "${ARCHIVE_NAME}.zip" HEAD; then
            echo "❌ Error: Failed to create ZIP archive"
            exit 1
          fi
          
          echo "Creating TAR.GZ archive..."
          if ! git archive --format=tar.gz --prefix="${ARCHIVE_NAME}/" -o "${ARCHIVE_NAME}.tar.gz" HEAD; then
            echo "❌ Error: Failed to create TAR.GZ archive"
            exit 1
          fi
          
          echo "✅ Created archives:"
          ls -lh "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}.tar.gz"
          
          # Verify archives exist and have content
          if [ ! -f "${ARCHIVE_NAME}.zip" ] || [ ! -s "${ARCHIVE_NAME}.zip" ]; then
            echo "❌ Error: ZIP archive is missing or empty"
            exit 1
          fi
          if [ ! -f "${ARCHIVE_NAME}.tar.gz" ] || [ ! -s "${ARCHIVE_NAME}.tar.gz" ]; then
            echo "❌ Error: TAR.GZ archive is missing or empty"
            exit 1
          fi
          
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Archive creation completed successfully"

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false' && steps.create_archive.outputs.archive_name != ''
        run: |
          set -e
          ARCHIVE_NAME="${{ steps.create_archive.outputs.archive_name }}"
          RELEASE_TAG="${{ steps.versions.outputs.release_tag }}"
          
          if [ -z "$ARCHIVE_NAME" ]; then
            echo "❌ Error: archive_name is not set. Cannot create release."
            exit 1
          fi
          
          if [ ! -f "${ARCHIVE_NAME}.zip" ] || [ ! -f "${ARCHIVE_NAME}.tar.gz" ]; then
            echo "❌ Error: Archive files not found. Expected: ${ARCHIVE_NAME}.zip and ${ARCHIVE_NAME}.tar.gz"
            exit 1
          fi
          
          echo "🚀 Creating GitHub release: $RELEASE_TAG"
          echo "📎 Attaching archives: ${ARCHIVE_NAME}.zip, ${ARCHIVE_NAME}.tar.gz"
          
          if ! gh release create "$RELEASE_TAG" \
            --title "Proxy v${{ steps.versions.outputs.proxy_version }} / Admin v${{ steps.versions.outputs.admin_version }}" \
            --notes "## EEN OAuth Proxy Release

          **Admin App Version:** ${{ steps.versions.outputs.admin_version }}
          **Proxy Version:** ${{ steps.versions.outputs.proxy_version }}

          ### Downloads
          - \`${ARCHIVE_NAME}.zip\` - ZIP archive
          - \`${ARCHIVE_NAME}.tar.gz\` - TAR.GZ archive

          ### Deployed URLs
          - **Admin App:** ${{ vars.VITE_REDIRECT_URI }}
          - **Proxy:** ${{ vars.VITE_PROXY_URL }}
          " \
            "${ARCHIVE_NAME}.zip" \
            "${ARCHIVE_NAME}.tar.gz"; then
            echo "❌ Error: Failed to create GitHub release"
            exit 1
          fi
          
          echo "✅ Successfully created release: $RELEASE_TAG"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: steps.check_release.outputs.exists == 'false'
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.versions.outputs.release_tag }}"
          RELEASE_TIME=$(TZ='America/Chicago' date +"%Y-%m-%d %H:%M:%S CT")
          ADMIN_APP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/admin/"

          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @- << 'EOF'
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 New Release: Proxy v${{ steps.versions.outputs.proxy_version }} / Admin v${{ steps.versions.outputs.admin_version }}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Admin Version:*\n${{ steps.versions.outputs.admin_version }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Proxy Version:*\n${{ steps.versions.outputs.proxy_version }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Released:*\n${RELEASE_TIME}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployed URLs:*\n• <${ADMIN_APP_URL}|Admin App>\n• OAuth Proxy: ${{ vars.VITE_PROXY_URL }}"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "📦 View Release",
                      "emoji": true
                    },
                    "url": "${RELEASE_URL}",
                    "style": "primary"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "📋 Release Notes",
                      "emoji": true
                    },
                    "url": "${RELEASE_URL}"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Triggered by GitHub Actions • Workflow: Create Release"
                  }
                ]
              }
            ]
          }
          EOF
          echo "✅ Slack notification sent"

      - name: Summary
        run: |
          if [ "${{ steps.check_release.outputs.exists }}" == "true" ]; then
            echo "### ⏭️ Release Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Release ${{ steps.versions.outputs.release_tag }} already exists." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Release Created" >> $GITHUB_STEP_SUMMARY
            echo "**Tag:** ${{ steps.versions.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "**Admin Version:** ${{ steps.versions.outputs.admin_version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Proxy Version:** ${{ steps.versions.outputs.proxy_version }}" >> $GITHUB_STEP_SUMMARY
          fi
