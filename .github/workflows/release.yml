name: Create Release

on:
  workflow_run:
    workflows: ["Test Deployed Admin App"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Get version numbers
        id: versions
        run: |
          set -e
          echo "📦 Reading version numbers from package.json files..."
          
          if [ ! -f "./admin/package.json" ]; then
            echo "❌ Error: admin/package.json not found"
            exit 1
          fi
          if [ ! -f "./proxy/package.json" ]; then
            echo "❌ Error: proxy/package.json not found"
            exit 1
          fi
          
          ADMIN_VERSION=$(node -p "require('./admin/package.json').version")
          PROXY_VERSION=$(node -p "require('./proxy/package.json').version")
          
          if [ -z "$ADMIN_VERSION" ] || [ -z "$PROXY_VERSION" ]; then
            echo "❌ Error: Failed to read version numbers"
            exit 1
          fi
          
          # Create combined release tag using both proxy and admin versions
          RELEASE_TAG="proxy-v${PROXY_VERSION}_admin-v${ADMIN_VERSION}"
          echo "admin_version=$ADMIN_VERSION" >> $GITHUB_OUTPUT
          echo "proxy_version=$PROXY_VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          echo "✅ Admin version: $ADMIN_VERSION"
          echo "✅ Proxy version: $PROXY_VERSION"
          echo "✅ Release tag: $RELEASE_TAG"

      - name: Check if release already exists
        id: check_release
        run: |
          set -e
          RELEASE_TAG="${{ steps.versions.outputs.release_tag }}"
          echo "🔍 Checking if release '$RELEASE_TAG' already exists..."
          
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Release $RELEASE_TAG already exists, skipping creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Release $RELEASE_TAG does not exist, will create new release"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get previous release tag
        id: prev_tag
        if: steps.check_release.outputs.exists == 'false'
        run: |
          set -e
          echo "🔍 Finding previous release tag..."

          # Find the nearest tag by git history (more reliable than date-sorted release list)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          # Fall back to gh release list if git describe fails (e.g., no tags exist yet)
          if [ -z "$PREV_TAG" ]; then
            echo "ℹ️ git describe found no tags, falling back to gh release list..."
            PREV_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "has_prev=true" >> $GITHUB_OUTPUT
            echo "✅ Previous release tag: $PREV_TAG"
          else
            echo "has_prev=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No previous release found, will include all commits"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        if: steps.check_release.outputs.exists == 'false'
        run: |
          set -e
          echo "📝 Generating changelog..."

          REPO_URL="https://github.com/${{ github.repository }}"

          # Exclude auto-generated version bump commits from changelog
          GREP_EXCLUDE="--grep=^bump version --invert-grep"

          if [ "${{ steps.prev_tag.outputs.has_prev }}" == "true" ]; then
            PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
            echo "Generating changelog from $PREV_TAG to HEAD..."
            COMMITS=$(git log --format="%h %s" --no-merges --max-count=100 $GREP_EXCLUDE "${PREV_TAG}..HEAD" 2>/dev/null || echo "")
          else
            echo "Generating changelog from all commits..."
            COMMITS=$(git log --format="%h %s" --no-merges --max-count=100 $GREP_EXCLUDE 2>/dev/null || echo "")
          fi

          if [ -z "$COMMITS" ]; then
            echo "- No changes recorded" > changelog.md
            echo "ℹ️ No commits found for changelog"
          else
            # Group commits by conventional commit prefix
            declare -A GROUPS
            GROUPS=(
              ["feat"]=""
              ["fix"]=""
              ["docs"]=""
              ["chore"]=""
              ["security"]=""
              ["ci"]=""
              ["other"]=""
            )
            declare -A GROUP_TITLES
            GROUP_TITLES=(
              ["feat"]="Features"
              ["fix"]="Bug Fixes"
              ["docs"]="Documentation"
              ["chore"]="Chores"
              ["security"]="Security"
              ["ci"]="CI/CD"
              ["other"]="Other Changes"
            )

            while IFS= read -r line; do
              SHA=$(echo "$line" | awk '{print $1}')
              SUBJECT=$(echo "$line" | cut -d' ' -f2-)
              ENTRY="- ${SUBJECT} ([${SHA}](${REPO_URL}/commit/${SHA}))"

              # Match conventional commit prefix (e.g., "feat:", "fix(scope):")
              PREFIX=$(echo "$SUBJECT" | sed -n 's/^\([a-z]*\)\(([^)]*)\)\{0,1\}:.*/\1/p')

              case "$PREFIX" in
                feat|fix|docs|chore|security|ci)
                  GROUPS[$PREFIX]+="${ENTRY}"$'\n'
                  ;;
                *)
                  GROUPS["other"]+="${ENTRY}"$'\n'
                  ;;
              esac
            done <<< "$COMMITS"

            # Write grouped changelog
            : > changelog.md
            HAS_GROUPS=false

            for key in feat fix security docs chore ci; do
              if [ -n "${GROUPS[$key]}" ]; then
                HAS_GROUPS=true
                echo "#### ${GROUP_TITLES[$key]}" >> changelog.md
                echo "${GROUPS[$key]}" >> changelog.md
              fi
            done

            # Always write "other" last
            if [ -n "${GROUPS["other"]}" ]; then
              if [ "$HAS_GROUPS" == "true" ]; then
                echo "#### ${GROUP_TITLES["other"]}" >> changelog.md
              fi
              echo "${GROUPS["other"]}" >> changelog.md
            fi

            COMMIT_COUNT=$(echo "$COMMITS" | wc -l | xargs)
            echo "✅ Generated changelog with ${COMMIT_COUNT} commits"
          fi

          echo "📝 Changelog contents:"
          cat changelog.md

      - name: Create release archive
        id: create_archive
        if: steps.check_release.outputs.exists == 'false'
        run: |
          set -e
          ARCHIVE_NAME="een-oauth-proxy-v${{ steps.versions.outputs.proxy_version }}_v${{ steps.versions.outputs.admin_version }}"
          echo "📦 Creating release archives with name: $ARCHIVE_NAME"
          
          echo "Creating ZIP archive..."
          if ! git archive --format=zip --prefix="${ARCHIVE_NAME}/" -o "${ARCHIVE_NAME}.zip" HEAD; then
            echo "❌ Error: Failed to create ZIP archive"
            exit 1
          fi
          
          echo "Creating TAR.GZ archive..."
          if ! git archive --format=tar.gz --prefix="${ARCHIVE_NAME}/" -o "${ARCHIVE_NAME}.tar.gz" HEAD; then
            echo "❌ Error: Failed to create TAR.GZ archive"
            exit 1
          fi
          
          echo "✅ Created archives:"
          ls -lh "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}.tar.gz"
          
          # Verify archives exist and have content
          if [ ! -f "${ARCHIVE_NAME}.zip" ] || [ ! -s "${ARCHIVE_NAME}.zip" ]; then
            echo "❌ Error: ZIP archive is missing or empty"
            exit 1
          fi
          if [ ! -f "${ARCHIVE_NAME}.tar.gz" ] || [ ! -s "${ARCHIVE_NAME}.tar.gz" ]; then
            echo "❌ Error: TAR.GZ archive is missing or empty"
            exit 1
          fi
          
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "✅ Archive creation completed successfully"

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false' && steps.create_archive.outputs.archive_name != ''
        run: |
          set -e
          ARCHIVE_NAME="${{ steps.create_archive.outputs.archive_name }}"
          RELEASE_TAG="${{ steps.versions.outputs.release_tag }}"
          
          if [ -z "$ARCHIVE_NAME" ]; then
            echo "❌ Error: archive_name is not set. Cannot create release."
            exit 1
          fi
          
          if [ ! -f "${ARCHIVE_NAME}.zip" ] || [ ! -f "${ARCHIVE_NAME}.tar.gz" ]; then
            echo "❌ Error: Archive files not found. Expected: ${ARCHIVE_NAME}.zip and ${ARCHIVE_NAME}.tar.gz"
            exit 1
          fi
          
          echo "🚀 Creating GitHub release: $RELEASE_TAG"
          echo "📎 Attaching archives: ${ARCHIVE_NAME}.zip, ${ARCHIVE_NAME}.tar.gz"
          
          # Build release notes file
          {
            echo "## EEN OAuth Proxy Release"
            echo ""
            echo "**Admin App Version:** ${{ steps.versions.outputs.admin_version }}"
            echo "**Proxy Version:** ${{ steps.versions.outputs.proxy_version }}"
            echo ""
            echo "### What's Changed"
            cat changelog.md
            echo ""
            echo "### Downloads"
            echo "- \`${ARCHIVE_NAME}.zip\` - ZIP archive"
            echo "- \`${ARCHIVE_NAME}.tar.gz\` - TAR.GZ archive"
            echo ""
            echo "### Deployed URLs"
            echo "- **Admin App:** ${{ vars.VITE_REDIRECT_URI }}"
            echo "- **Proxy:** ${{ vars.VITE_PROXY_URL }}"
          } > release_notes.md

          echo "📝 Release notes:"
          cat release_notes.md

          if ! gh release create "$RELEASE_TAG" \
            --title "Proxy v${{ steps.versions.outputs.proxy_version }} / Admin v${{ steps.versions.outputs.admin_version }}" \
            --notes-file release_notes.md \
            "${ARCHIVE_NAME}.zip" \
            "${ARCHIVE_NAME}.tar.gz"; then
            echo "❌ Error: Failed to create GitHub release"
            exit 1
          fi
          
          echo "✅ Successfully created release: $RELEASE_TAG"
          echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: steps.check_release.outputs.exists == 'false'
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.versions.outputs.release_tag }}"
          RELEASE_TIME=$(TZ='America/Chicago' date +"%Y-%m-%d %H:%M:%S CT")

          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 New Release: Proxy v${{ steps.versions.outputs.proxy_version }} / Admin v${{ steps.versions.outputs.admin_version }}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Admin Version:*\n${{ steps.versions.outputs.admin_version }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Proxy Version:*\n${{ steps.versions.outputs.proxy_version }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Released:*\n${RELEASE_TIME}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployed URLs:*\n• <${{ vars.VITE_REDIRECT_URI }}|Admin App>\n• <${{ vars.VITE_PROXY_URL }}|OAuth Proxy>"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "📦 View Release",
                      "emoji": true
                    },
                    "url": "${RELEASE_URL}",
                    "style": "primary"
                  },
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "📋 Release Notes",
                      "emoji": true
                    },
                    "url": "${RELEASE_URL}"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Triggered by GitHub Actions • Workflow: Create Release"
                  }
                ]
              }
            ]
          }
          EOF
          echo "✅ Slack notification sent"

      - name: Summary
        run: |
          if [ "${{ steps.check_release.outputs.exists }}" == "true" ]; then
            echo "### ⏭️ Release Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Release ${{ steps.versions.outputs.release_tag }} already exists." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Release Created" >> $GITHUB_STEP_SUMMARY
            echo "**Tag:** ${{ steps.versions.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "**Admin Version:** ${{ steps.versions.outputs.admin_version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Proxy Version:** ${{ steps.versions.outputs.proxy_version }}" >> $GITHUB_STEP_SUMMARY
          fi
