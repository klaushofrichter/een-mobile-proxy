name: Test Deployed Admin App

on:
  workflow_run:
    workflows: ["Deploy Admin to GitHub Pages"]
    types:
      - completed
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: admin

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: admin

      - name: Check VITE_PROXY_URL is configured
        run: |
          if [ -z "${{ vars.VITE_PROXY_URL }}" ]; then
            echo "::error::VITE_PROXY_URL repository variable is not set. Please add it in Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          echo "✅ VITE_PROXY_URL is configured: ${{ vars.VITE_PROXY_URL }}"

      - name: Run tests against Cloudflare proxy
        run: npx playwright test -x
        working-directory: admin
        env:
          VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL }}
          VITE_EEN_CLIENT_ID: ${{ secrets.VITE_EEN_CLIENT_ID }}
          VITE_REDIRECT_URI: 'http://127.0.0.1:3333'
          ADMIN_TEST_USER: ${{ secrets.ADMIN_TEST_USER }}
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: admin/test-results/
          retention-days: 7

      - name: Notify Slack - Success
        if: success()
        run: |
          TEST_TIME=$(TZ='America/Chicago' date +"%Y-%m-%d %H:%M:%S CT")
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "✅ Production Tests PASSED",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\nAll tests passed"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Completed:*\n${TEST_TIME}"
                  }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "📋 View Results",
                      "emoji": true
                    },
                    "url": "${RUN_URL}",
                    "style": "primary"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Tested via GitHub Actions • Workflow: Test Deployed Admin App"
                  }
                ]
              }
            ]
          }
          EOF
          echo "✅ Slack success notification sent"

      - name: Notify Slack - Failure
        if: failure()
        run: |
          TEST_TIME=$(TZ='America/Chicago' date +"%Y-%m-%d %H:%M:%S CT")
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @- << EOF
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 Production Tests FAILED",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*⚠️ ATTENTION REQUIRED: Tests failed after production deployment!*"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Status:*\n❌ FAILED"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Time:*\n${TEST_TIME}"
                  }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "🔍 View Failure Details",
                      "emoji": true
                    },
                    "url": "${RUN_URL}",
                    "style": "danger"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Tested via GitHub Actions • Workflow: Test Deployed Admin App"
                  }
                ]
              }
            ]
          }
          EOF
          echo "🚨 Slack failure notification sent"
