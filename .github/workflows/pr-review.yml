name: Claude Code Review

on:
  pull_request:
    branches:
      - production
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Please review this pull request and provide constructive feedback on:
            1. Code quality and best practices
            2. Potential bugs or issues
            3. Performance considerations
            4. Security concerns

            Be concise but thorough. Focus on actionable feedback.

            At the end, provide a clear "Final Result" section summarizing your review.

      - name: Extract and Post Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const execFile = '${{ steps.claude-review.outputs.execution_file }}';

            if (!execFile || !fs.existsSync(execFile)) {
              console.log('No execution file found');
              return;
            }

            const turns = JSON.parse(fs.readFileSync(execFile, 'utf8'));

            // Find the last assistant message with text content
            let finalResult = '';
            for (const turn of turns) {
              if (turn.type === 'assistant' && turn.message?.content) {
                for (const block of turn.message.content) {
                  if (block.type === 'text' && block.text) {
                    finalResult = block.text;
                  }
                }
              }
            }

            if (!finalResult) {
              console.log('No final result found in execution output');
              console.log('Turn types found:', turns.map(t => t.type));
              return;
            }

            // Post as PR comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Claude Code Review\n\n${finalResult}\n\n---\n*Automated review by Claude Code*`
            });

            console.log('Posted review comment to PR');
