name: Claude Code Review

on:
  pull_request:
    branches:
      - production
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read additional review prompts
        id: read-prompts
        run: |
          if [ -f ".github/claude-review.md" ]; then
            echo "extra_prompt<<EOF" >> $GITHUB_OUTPUT
            cat .github/claude-review.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "extra_prompt=" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Please review this pull request and provide constructive feedback on:
            1. Code quality and best practices
            2. Potential bugs or issues
            3. Performance considerations
            4. Security concerns

            Be concise but thorough. Focus on actionable feedback.

            At the end, provide a clear "Final Result" section summarizing your review.

            ${{ steps.read-prompts.outputs.extra_prompt }}

      - name: Extract and Post Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const execFile = '${{ steps.claude-review.outputs.execution_file }}';

            if (!execFile || !fs.existsSync(execFile)) {
              core.warning('No execution file found - review comment will not be posted');
              return;
            }

            let turns;
            try {
              turns = JSON.parse(fs.readFileSync(execFile, 'utf8'));
            } catch (error) {
              core.warning(`Failed to parse execution file: ${error.message}`);
              return;
            }

            // Find the last assistant message with text content (intentionally keeps only
            // the final review text, not concatenating intermediate messages)
            let finalResult = '';
            for (const turn of turns) {
              if (turn.type === 'assistant' && turn.message?.content) {
                for (const block of turn.message.content) {
                  if (block.type === 'text' && block.text) {
                    finalResult = block.text;
                  }
                }
              }
            }

            if (!finalResult) {
              core.warning('No final result found in execution output');
              console.log('Turn types found:', turns.map(t => t.type));
              return;
            }

            // Get the workflow run URL
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Post as PR comment
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## Claude Code Review\n\n${finalResult}\n\n---\n*Automated review by Claude Code* | [View full review details](${runUrl})`
              });
              console.log('Posted review comment to PR');
            } catch (error) {
              core.setFailed(`Failed to post review comment: ${error.message}`);
            }
