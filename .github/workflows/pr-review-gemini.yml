name: Gemini Code Review

on:
  pull_request:
    branches:
      - production
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read additional review prompts
        id: read-prompts
        run: |
          PROMPT_FILE=".github/claude-review.md"
          MAX_SIZE=4096  # Limit to 4KB to prevent prompt overflow
          if [ -f "$PROMPT_FILE" ]; then
            FILE_SIZE=$(wc -c < "$PROMPT_FILE")
            if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
              echo "::error::claude-review.md exceeds ${MAX_SIZE} bytes (${FILE_SIZE} bytes). Please reduce file size to prevent instructions being cut off."
              exit 1
            fi
            echo "extra_prompt<<EOF" >> $GITHUB_OUTPUT
            cat "$PROMPT_FILE" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            # No custom prompts file found - continue with default prompts only
            echo "extra_prompt=" >> $GITHUB_OUTPUT
          fi

      - name: Get PR diff
        id: get-diff
        run: |
          # Get the diff between base and head
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          # Truncate if too large (Gemini has token limits)
          head -c 100000 pr_diff.txt > pr_diff_truncated.txt
          echo "diff_file=pr_diff_truncated.txt" >> $GITHUB_OUTPUT

      - name: Get changed files list
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Run Gemini Code Review
        id: gemini-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Build the prompt - Gemini focuses on security and reliability
          REVIEW_PROMPT="Please review this pull request with a focus on CODE SECURITY and RELIABILITY.

          Specifically analyze:
          1. Security vulnerabilities (injection attacks, XSS, CSRF, authentication/authorization issues)
          2. Input validation and sanitization
          3. Error handling and edge cases
          4. Resource leaks and memory management
          5. Race conditions and concurrency issues
          6. Dependency security concerns
          7. Secrets or credentials exposure
          8. API security best practices

          Be concise but thorough. Focus on actionable security and reliability feedback.

          At the end, provide a clear \"Security Assessment\" section with:
          - Risk level (Low/Medium/High/Critical)
          - Summary of findings
          - Recommended actions

          ${{ steps.read-prompts.outputs.extra_prompt }}

          Here are the changed files:
          $(cat changed_files.txt)

          Here is the diff:
          $(cat pr_diff_truncated.txt)"

          # Escape the prompt for JSON
          ESCAPED_PROMPT=$(echo "$REVIEW_PROMPT" | jq -Rs .)

          # Call Gemini API
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": $ESCAPED_PROMPT
                }]
              }],
              \"generationConfig\": {
                \"temperature\": 0.2,
                \"maxOutputTokens\": 8192
              }
            }")

          # Extract the review text from response
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$REVIEW_TEXT" ]; then
            echo "::warning::Failed to get review from Gemini API (informational only)"
            echo "API Response: $RESPONSE"
            echo "Gemini review unavailable - see workflow logs for details." > gemini_review.txt
          else
            # Save review to file for the next step
            echo "$REVIEW_TEXT" > gemini_review.txt
            echo "Review generated successfully"
          fi

      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const reviewFile = 'gemini_review.txt';
            if (!fs.existsSync(reviewFile)) {
              core.warning('Review file not found (informational only)');
              return;
            }

            const reviewText = fs.readFileSync(reviewFile, 'utf8');
            if (!reviewText.trim()) {
              core.warning('Review text is empty (informational only)');
              return;
            }

            // Get the workflow run URL
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Post as PR comment
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## Gemini Security Review\n\n${reviewText}\n\n---\n*Automated security review by Google Gemini (informational)* | [View full review details](${runUrl})`
              });
              console.log('Posted Gemini review comment to PR');
            } catch (error) {
              core.warning(`Failed to post review comment: ${error.message}`);
            }
