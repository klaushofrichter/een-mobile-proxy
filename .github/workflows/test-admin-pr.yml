name: Test Admin PR (Local Proxy)

on:
  pull_request:
    branches:
      - production
    paths:
      - 'admin/**'
      - 'proxy/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            admin/package-lock.json
            proxy/package-lock.json

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Install proxy dependencies
        run: npm ci
        working-directory: proxy

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: admin

      - name: Create proxy dev vars
        run: |
          printf 'CLIENT_ID="%s"\n' "$CLIENT_ID" > .dev.vars
          printf 'CLIENT_SECRET="%s"\n' "$CLIENT_SECRET" >> .dev.vars
          printf 'ADMIN_EMAILS="%s"\n' "$ADMIN_EMAILS" >> .dev.vars
          printf 'ALLOWED_SCHEMES="http"\n' >> .dev.vars
          printf 'ENVIRONMENT="development"\n' >> .dev.vars
        working-directory: proxy
        env:
          CLIENT_ID: ${{ secrets.VITE_EEN_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.EEN_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.TEST_USER }}

      - name: Run Playwright tests
        run: npx playwright test -x
        working-directory: admin
        env:
          VITE_EEN_CLIENT_ID: ${{ secrets.VITE_EEN_CLIENT_ID }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_NON_ADMIN_USER: ${{ secrets.TEST_NON_ADMIN_USER }}
          TEST_NON_ADMIN_PASSWORD: ${{ secrets.TEST_NON_ADMIN_PASSWORD }}

      - name: Show proxy health on failure
        if: failure()
        run: |
          curl -s http://127.0.0.1:3333/health 2>&1 || echo "Proxy not reachable"
          echo "---"
          ps aux | grep wrangler | grep -v grep || echo "No wrangler process found"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-pr
          path: admin/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots-pr
          path: admin/test-results/
          retention-days: 7
